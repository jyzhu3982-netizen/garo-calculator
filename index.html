t-size:21px;margin:2px 0}.salesbox small{color:var(--muted)}.filters{display:grid;grid-template-columns:1.1fr repeat(3,1fr);gap:8px;margin:13px 0}.filters input,.filters select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px}.duelist{display:grid;gap:7px;max-height:340px;overflow:auto}.dueitem{display:grid;grid-template-columns:75px 1fr 115px 90px auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:11px;background:#fff;padding:9px;font-size:12px}.dueitem strong{font-size:14px}.phase{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:999px;background:#e9edf8;color:#52689c;font-size:10px;font-weight:800}.phase.induction{background:#e4f4ee;color:var(--green)}.sectionbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:23px 0 10px}.sectionbar p{margin:4px 0 0}.timeline{display:grid;gap:7px}.dose{display:grid;grid-template-columns:14px minmax(180px,1.2fr) .7fr minmax(220px,1.25fr);align-items:center;gap:9px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px 11px}.dose.maintenance{border-left:4px solid var(--violet)}.dose.next{border-color:#55b9a7;background:#f0faf7}.dot{width:9px;height:9px;border-radius:50%;background:#c6d5d0}.dose.done .dot{background:var(--green2);box-shadow:0 0 0 4px #dff4ed}.node{font-weight:800;font-size:13px}.status{font-size:10px;border-radius:999px;padding:4px 7px;background:#edf2ef;color:var(--muted);white-space:nowrap}.dose.done .status{background:#dff4ed;color:#086b5b}.actual{display:flex;align-items:center;gap:6px}.actual input{width:100%;min-width:116px;border:1px solid var(--line);border-radius:9px;padding:7px}.actual .qty{width:58px;min-width:58px}.refs{margin-top:20px;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.65}.refs a{color:var(--green)}dialog{width:min(440px,calc(100% - 28px));border:0;border-radius:17px;padding:21px;box-shadow:0 28px 80px rgba(0,0,0   </div>
</main>
<dialog id="patientDialog"><form method="dialog" id="patientForm"><h3 id="dialogTitle">新增匿名患者</h3><div class="field"><label for="codeInput">匿名编号（必填）</label><input id="codeInput" maxlength="30" placeholder="例如：FL-023" required></div><div class="field" style="margin-top:13px"><label for="diseaseInput">病型 / 分级 / 分期（不得填写姓名）</label><input id="diseaseInput" maxlength="50" placeholder="例如：FL 3A"></div><div class="field" style="margin-top:13px"><label for="regimenInput">适应证 / 诱导方案</label><select id="regimenInput"></select></div><div class="dialog-actions"><button class="btn ghost" value="cancel">取消</button><button class="btn" value="default">保存</button></div></form></dialog>

<script>
(()=>{
  'use strict';
  // ==================== Supabase 配置 ====================

  const DAY=86400000,KEY='gazyva_followup_v3',OLD_KEY='gazyva_followup_v2';

  const FIELDS='id,patient_no,disease_type,induce_start_date,maintain_first_date,maintain_status,total_induce_cycles,total_maintain_cycles,creator_name,created_at,updated_at,is_dropout';
  const REGIMENS={
    cll:{label:'CLL｜与苯丁酸氮芥联合（6×28天）',short:'CLL · 6周期',nodes:makeCLL()},
    fl_chop:{label:'滤泡性淋巴瘤｜G-CHOP（6周期联合＋2周期单药）',short:'FL · G-CHOP',nodes:makeFL(8,21,6)},
    fl_cvp:{label:'滤泡性淋巴瘤｜G-CVP（8×21天）',short:'FL · G-CVP',nodes:makeFL(8,21)},
    fl_benda:{label:'滤泡性淋巴瘤｜G-苯达莫司汀（6×28天）',short:'FL · G-苯达莫司汀',nodes:makeFL(6,28)},
    other:{label:'其他 / 单药 / 待确认（不自动排期）',short:'待确认方案',nodes:[]}
  };
  function makeCLL(){const a=[{id:'c1d1',label:'第1周期 第1天',offset:0,dose:'100 mg'},{id:'c1d2',label:'第1周期 第2天',offset:1,dose:'900 mg'},{id:'c1d8',label:'第1周期 第8天',offset:7,dose:'1,000 mg'},{id:'c1d15',label:'第1周期 第15天',offset:14,dose:'1,000 mg'}];for(let c=2;c<=6;c++)a.push({id:`c${c}d1`,label:`第${c}周期 第1天`,offset:(c-1)*28,dose:'1,000 mg'});return a}
  function makeFL(cycles,len,combined=cycles){const a=[{id:'c1d1',label:'第1周期 第1天',offset:0,dose:'1,000 mg'},{id:'c1d8',label:'第1周期 第8天',offset:7,dose:'1,000 mg'},{id:'c1d15',label:'第1周期 第15天',offset:14,dose:'1,000 mg'}];for(let c=2;c<=cycles;c++)a.push({id:`c${c}d1`,label:`第${c}周期 第1天${c>combined?'（佳罗华单药）':''}`,offset:(c-1)*len,dose:'1,000 mg'});return a}
  const SEED=[['待补充','fl_chop'],['FL 3A','fl_chop'],['FL','fl_chop'],['FL 3A','fl_benda'],['FL 3A','fl_benda'],['FL 3A','fl_chop'],['FL 3B','fl_chop'],['FL 3A','fl_benda'],['FL 3A','fl_benda'],['FL 2','fl_benda'],['FL','other'],['FL 3A','fl_chop'],['FL 4期','fl_benda'],['FL 2级','fl_chop'],['FL 2A','fl_chop'],['初治 FL','fl_benda'],['FL 3期','fl_benda'],['FL 3B','fl_chop'],['FL','fl_benda'],['FL','fl_chop'],['FL 3A','fl_benda'],['FL','fl_chop'],['FL 2-3A','fl_chop'],['FL','fl_chop'],['FL','fl_chop'],['FL','fl_chop'],['FL 3B','fl_chop'],['FL 2A','fl_chop'],['FL 3A','fl_chop'],['FL 3A','fl_chop'],['FL 3A','fl_benda'],['FL 3A','fl_benda'],['初治 FL','fl_chop'],['初治 FL','other'],['FL','fl_chop'],['FL','fl_benda'],['FL','fl_benda'],['FL 4期','fl_benda']];
  const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  let state=load(),selected=state.patients[0]?.id||null,editId=null;
  let db=null,realtimeChannel=null,realtimeTimer=null,remoteLoading=false,pendingRemoteReload=false,initialSyncPending=false,realtimeErrorShown=false;
  const remoteWriteQueues=new Map(),remoteWriteVersions=new Map();
  function fresh(){return {version:3,patients:SEED.map((r,i)=>({id:`seed-p${String(i+1).padStart(3,'0')}`,code:`P${String(i+1).padStart(3,'0')}`,disease:r[0],regimen:r[1],anchor:'',actual:{},qty:{},status:'active',rolling:true,maintenanceStatus:'anticipated'}))}}
  function load(){for(const key of [KEY,OLD_KEY])try{const x=JSON.parse(localStorage.getItem(key));if(x&&Array.isArray(x.patients))return x}catch(e){}return fresh()}
  function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
  function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
  function parse(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
  function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
  function addMonths(s,n){const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return iso(d)}
  function format(s){return s?new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'short',day:'numeric',weekday:'short'}).format(parse(s)):'—'}
  function daysFromToday(s){const d=new Date();d.setHours(0,0,0,0);return Math.round((parse(s)-d)/DAY)}
  function isFL(p){return ['fl_chop','fl_cvp','fl_benda'].includes(p.regimen)}
  function maintenanceState(p){return p.maintenanceStatus||(p.maintenance===false?'none':'anticipated')}
  function anchorFor(p){if(p.anchor)return p.anchor;for(const n of REGIMENS[p.regimen].nodes)if(p.actual?.[n.id])return addDays(p.actual[n.id],-n.offset);return ''}
  function planFor(p){
    const anchor=anchorFor(p),induction=REGIMENS[p.regimen].nodes.map(n=>({...n,phase:'induction'}));
    const maintenance=isFL(p)&&maintenanceState(p)!=='none'?Array.from({length:12},(_,i)=>({id:`m${i+1}`,label:`维持期 第${i+1}次`,dose:'1,000 mg',phase:'maintenance',maintenanceNo:i+1})):[];
    if(!anchor)return [...induction,...maintenance].map(n=>({...n,date:'',standard:''}));
    const base=induction.map(n=>({...n,date:addDays(anchor,n.offset),standard:addDays(anchor,n.offset)})),finalStandard=base.at(-1)?.standard||'';
    let last=-1,shift=0;
    if(p.rolling)for(let i=0;i<base.length;i++)if(p.actual?.[base[i].id]){last=i;shift=Math.round((parse(p.actual[base[i].id])-parse(base[i].standard))/DAY);if(p.regimen==='cll'&&base[i].id==='c1d2'&&p.actual.c1d1===p.actual.c1d2)shift=0}
    const inductionPlan=base.map((n,i)=>p.rolling&&i>last&&last>=0?{...n,date:addDays(n.standard,shift)}:n),projectedFinal=p.rolling&&last>=0?addDays(finalStandard,shift):finalStandard;
    const standardStart=p.maintenanceStart||(finalStandard?addMonths(finalStandard,2):''),plannedStart=p.maintenanceStart||(projectedFinal?addMonths(projectedFinal,2):'');
    return [...inductionPlan,...maintenance.map((n,i)=>({...n,standard:standardStart?addMonths(standardStart,i*2):'',date:plannedStart?addMonths(plannedStart,i*2):''}))]
  }
  function monthStats(month){let actualVisits=0,actualQty=0,forecastVisits=0,forecastQty=0;for(const p of state.patients)for(const n of planFor(p)){const a=p.actual?.[n.id],q=Number(p.qty?.[n.id]??1);if(a?.slice(0,7)===month){actualVisits++;actualQty+=q}else if(!a&&p.status!=='dropped'&&n.date?.slice(0,7)===month){forecastVisits++;forecastQty+=q}}return {actualVisits,actualQty,forecastVisits,forecastQty}}
  function dueRows(month){const phase=state.duePhase||'all',status=state.dueStatus||'pending',regimen=state.dueRegimen||'all',query=(state.dueQuery||'').toLowerCase(),rows=[];for(const p of state.patients){if(regimen!=='all'&&p.regimen!==regimen)continue;if(query&&!`${p.code} ${p.disease||''}`.toLowerCase().includes(query))continue;for(const n of planFor(p)){if(phase!=='all'&&n.phase!==phase)continue;const actual=p.actual?.[n.id];if(status!=='pending'&&actual?.slice(0,7)===month)rows.push({p,n,date:actual,done:true});if(status!=='completed'&&!actual&&p.status!=='dropped'&&n.date?.slice(0,7)===month)rows.push({p,n,date:n.date,done:false})}}return rows.sort((a,b)=>a.date.localeCompare(b.date)||a.p.code.localeCompare(b.p.code,'zh-CN'))}
  function toast(text){const e=$('#toast');e.textContent=text;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1800)}
  const REMOTE_PLAN={cll:'CLL｜苯丁酸氮芥',fl_chop:'FL｜G-CHOP',fl_cvp:'FL｜G-CVP',fl_benda:'FL｜G-苯达莫司汀',other:'其他 / 待确认'};
  function dateOnly(v){return v?String(v).slice(0,10):''}
  function totalInduceCycles(p){return p.regimen==='cll'||p.regimen==='fl_benda'?6:(p.regimen==='fl_chop'||p.regimen==='fl_cvp'?8:0)}
  function encodeDiseaseType(p){return REMOTE_PLAN[p.regimen]||REMOTE_PLAN.other}
  function decodeDiseaseType(value,totalCycles=0){const text=String(value||'').trim();for(const [regimen,label] of Object.entries(REMOTE_PLAN)){if(text===label||text.startsWith(label+'｜')){const disease=text===label?(regimen==='cll'?'CLL':regimen.startsWith('fl_')?'FL':'待补充'):text.slice(label.length+1);return {regimen,disease}}}if(/CLL/i.test(text))return {regimen:'cll',disease:text||'CLL'};if(/G[- ]?CVP/i.test(text))return {regimen:'fl_cvp',disease:text||'FL'};if(/苯达莫司汀|Benda|\bGB\b/i.test(text))return {regimen:'fl_benda',disease:text||'FL'};if(/G[- ]?CHOP/i.test(text))return {regimen:'fl_chop',disease:text||'FL'};if(/\bFL\b/i.test(text))return {regimen:Number(totalCycles)===6?'fl_benda':'fl_chop',disease:text};return {regimen:'other',disease:text||'待补充'}}
  function maintenanceFromRemote(value){if(value==='不纳入'||value==='none')return 'none';if(value==='医生已确认纳入'||value==='已确认纳入'||value==='confirmed')return 'confirmed';return 'anticipated'}
  function maintenanceToRemote(value){return value==='none'?'不纳入':value==='confirmed'?'医生已确认纳入':'预计纳入'}
  function remoteToPatient(row,preserve={}){const decoded=decodeDiseaseType(row.disease_type,row.total_induce_cycles),planOnly=Object.values(REMOTE_PLAN).includes(String(row.disease_type||'').trim()),hasLocalDisease=Object.prototype.hasOwnProperty.call(preserve,'disease');return {...preserve,id:String(row.id),code:row.patient_no||preserve.code||'',disease:planOnly&&hasLocalDisease?preserve.disease:decoded.disease,regimen:decoded.regimen,anchor:dateOnly(row.induce_start_date),maintenanceStart:dateOnly(row.maintain_first_date),maintenanceStatus:maintenanceFromRemote(row.maintain_status),status:row.is_dropout?'dropped':'active',actual:preserve.actual||{},qty:preserve.qty||{},rolling:preserve.rolling??true,dropDate:preserve.dropDate||'',dropReason:preserve.dropReason||'',_remote:true,_creatorName:row.creator_name||preserve._creatorName||'',_createdAt:row.created_at||null,_updatedAt:row.updated_at||null}}
  function patientPayload(p){const hasMaintenance=isFL(p)&&maintenanceState(p)!=='none';return {patient_no:p.code,disease_type:encodeDiseaseType(p),induce_start_date:p.anchor||null,maintain_first_date:hasMaintenance?(p.maintenanceStart||null):null,maintain_status:hasMaintenance?maintenanceToRemote(maintenanceState(p)):'不纳入',total_induce_cycles:totalInduceCycles(p),total_maintain_cycles:hasMaintenance?12:0,creator_name:p._creatorName||localStorage.getItem('garo_creator_name')||'网页看板',is_dropout:p.status==='dropped'}}
  function supabaseConfigured(){return /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(supabaseUrl)&&!/YOUR_|YOUR-PROJECT/i.test(supabaseUrl+supabaseAnonKey)&&supabaseAnonKey.length>30}

  async function initSupabase(){

      if(!window.supabase?.createClient)throw new Error('Supabase JS客户端加载失败，请检查网络连接');
      db=window.supabase.createClient(supabaseUrl,supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
      await loadRemotePatients({silent:true});
      startRealtime();
    }catch(error){db=null;alert('Supabase连接失败：'+friendlyError(error))}
    finally{initialSyncPending=false}
  }
  async function loadRemotePatients({silent=false}={}){
    if(!db)return;if(remoteLoading){pendingRemoteReload=true;return}remoteLoading=true;
    try{
      const {data,error}=await db.from(TABLE).select(FIELDS).order('updated_at',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false,nullsFirst:false});
      if(error)throw error;
      const localById=new Map(state.patients.map(p=>[String(p.id),p])),localByCode=new Map(state.patients.map(p=>[p.code,p]));
      state.patients=(data||[]).map(row=>remoteToPatient(row,localById.get(String(row.id))||localByCode.get(row.patient_no)||{}));
      if(!state.patients.some(p=>p.id===selected))selected=state.patients[0]?.id||null;
      persist();render();
    }catch(error){if(!silent)alert('Supabase读取失败：'+friendlyError(error));throw error}
    finally{remoteLoading=false;if(pendingRemoteReload){pendingRemoteReload=false;scheduleRemoteReload()}}
  }
  function scheduleRemoteReload(){
    clearTimeout(realtimeTimer);
    const refresh=()=>{const tag=document.activeElement?.tagName;if(remoteWriteQueues.size||['INPUT','SELECT','TEXTAREA'].includes(tag)){realtimeTimer=setTimeout(refresh,500);return}loadRemotePatients({silent:true}).catch(()=>{})};
    realtimeTimer=setTimeout(refresh,250);
  }
  function startRealtime(){
    if(!db)return;
    if(realtimeChannel)db.removeChannel(realtimeChannel);
    realtimeChannel=db.channel('garo-patients-dashboard-'+Math.random().toString(36).slice(2,8)).on('postgres_changes',{event:'*',schema:'public',table:TABLE},scheduleRemoteReload).subscribe(status=>{if(status==='SUBSCRIBED'){realtimeErrorShown=false;scheduleRemoteReload()}if(['CHANNEL_ERROR','TIMED_OUT'].includes(status)&&!realtimeErrorShown){realtimeErrorShown=true;alert('Supabase连接失败：实时同步暂不可用，请检查网络和 Realtime 配置。')}});
  }
  async function saveRemotePatient(p,{checkVersion=false}={}){
    if(!db){if(remoteRequired)throw new Error('Supabase尚未连接，请检查网络、Key 和 RLS 配置');return p}
    if(initialSyncPending)throw new Error('Supabase正在完成首次同步，请稍后再保存');
    const payload=patientPayload(p);let data,error;
    if(p._remote){let query=db.from(TABLE).update({...payload,updated_at:new Date().toISOString()}).eq('id',p.id);if(checkVersion)query=p._updatedAt?query.eq('updated_at',p._updatedAt):query.is('updated_at',null);({data,error}=await query.select(FIELDS).single())}
    else{({data,error}=await db.from(TABLE).insert(payload).select(FIELDS).single())}
    if(error)throw error;
    return remoteToPatient(data,p)
  }
  async function syncRemotePatient(p){
    if(!db){if(remoteRequired)alert('Supabase保存失败：Supabase尚未连接，请检查网络、Key 和 RLS 配置。');return}if(!p?._remote)return;
    const id=String(p.id),version=(remoteWriteVersions.get(id)||0)+1,snapshot={...p,actual:{...(p.actual||{})},qty:{...(p.qty||{})}};remoteWriteVersions.set(id,version);
    const previous=remoteWriteQueues.get(id)||Promise.resolve(),task=previous.catch(()=>{}).then(()=>saveRemotePatient(snapshot));remoteWriteQueues.set(id,task);
    try{const saved=await task;if(remoteWriteVersions.get(id)!==version)return;const index=state.patients.findIndex(x=>String(x.id)===id);if(index>=0){const current=state.patients[index];state.patients[index]={...saved,actual:current.actual||{},qty:current.qty||{},rolling:current.rolling??true,dropDate:current.dropDate||'',dropReason:current.dropReason||'',disease:current.disease??saved.disease};persist()}}
    catch(error){alert('Supabase保存失败：'+friendlyError(error))}
    finally{if(remoteWriteQueues.get(id)===task)remoteWriteQueues.delete(id)}
  }
  async function deleteRemotePatient(p){if(!db){if(remoteRequired)throw new Error('Supabase尚未连接，请检查网络、Key 和 RLS 配置');return}if(initialSyncPending)throw new Error('Supabase正在完成首次同步，请稍后再删除');if(!p?._remote)return;const {error}=await db.from(TABLE).delete().eq('id',p.id);if(error)throw error}
  function options(sel){return Object.entries(REGIMENS).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${esc(v.label)}</option>`).join('')}
  function render(){renderPatients();renderWorkspace()}
  function renderPatients(){const e=$('#patients');if(!state.patients.length){e.innerHTML='<div class="empty">尚无记录<br>仅使用匿名编号</div>';return}e.innerHTML=state.patients.map(p=>`<button class="patient ${p.id===selected?'active':''}" data-id="${esc(p.id)}"><strong>${esc(p.code)}</strong><span>${esc(p.disease||'病型待补充')} · ${esc(REGIMENS[p.regimen]?.short||'未知方案')}</span></button>`).join('');e.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()})}
  function dueRow({p,n,date,done}){return `<div class="dueitem"><strong>${esc(p.code)}</strong><div>${esc(p.disease||'病型待补充')}<span class="phase ${n.phase}">${n.phase==='maintenance'?'维持':'诱导'}</span><div class="planned">${esc(n.label)} · ${done?'已完成':'待回院'}</div></div><span class="due-regimen">${esc(REGIMENS[p.regimen]?.short||'未知')}</span><span class="due-date">${format(date)}</span><button class="btn ghost small" data-show="${esc(p.id)}">查看</button></div>`}
  function doseRow(n,p,next){const actual=p.actual?.[n.id]||'',done=!!actual,changed=n.date&&n.standard&&n.date!==n.standard;return `<div class="dose ${n.phase==='maintenance'?'maintenance':''} ${done?'done':''} ${next?.id===n.id?'next':''}"><span class="dot"></span><div><div class="node">${esc(n.label)} · ${esc(n.dose)}<span class="phase ${n.phase}">${n.phase==='maintenance'?'维持':'诱导'}</span></div><div class="planned">${changed?`重估：${format(n.date)}｜原计划：${format(n.standard)}`:`计划：${n.date?format(n.date):'待确定首剂日期'}`}</div></div><span class="status">${done?'已完成':next?.id===n.id?'下一节点':'待完成'}</span><div class="actual"><input type="date" max="${iso(new Date())}" aria-label="${esc(n.label)}实际日期" data-node="${n.id}" value="${esc(actual)}"><input class="qty" type="number" min="0" step="1" aria-label="${esc(n.label)}支数" data-qty="${n.id}" value="${Number(p.qty?.[n.id]??1)}"><span class="planned">支</span></div></div>`}
  function renderWorkspace(){
    const host=$('#workspace'),p=state.patients.find(x=>x.id===selected);if(!p){host.innerHTML='<div class="empty">请新增一个匿名患者开始记录。</div>';return}
    const anchor=anchorFor(p),plan=planFor(p),next=p.status==='dropped'?null:plan.find(n=>!p.actual?.[n.id]),delta=next?.date?daysFromToday(next.date):null,month=state.reportMonth||iso(new Date()).slice(0,7),stats=monthStats(month),due=dueRows(month);
    host.innerHTML=`<div class="toolbar"><h2>患者 ${esc(p.code)} <span class="planned">${esc(p.disease||'')}</span></h2><div><button class="btn ghost small" id="editBtn">编辑</button> <button class="btn danger small" id="deleteBtn">删除</button></div></div>
    <div class="formgrid"><div class="field"><label>当前方案</label><select id="regimenSelect">${options(p.regimen)}</select></div><div class="field anchor"><div><label>诱导首剂日期（第1周期第1天）</label><input id="anchorInput" type="date" value="${esc(anchor)}"></div><button class="btn secondary" id="todayBtn">今天</button></div><div class="field"><label>日期预测方式</label><select id="rollingSelect"><option value="0" ${!p.rolling?'selected':''}>标准时间轴</option><option value="1" ${p.rolling?'selected':''}>按实际延期滚动重估后续诱导</option></select></div><div class="field"><label>患者状态</label><select id="statusSelect"><option value="active" ${p.status!=='dropped'?'selected':''}>治疗中 / 随访中</option><option value="dropped" ${p.status==='dropped'?'selected':''}>已脱落（排除未来预测）</option></select></div>${isFL(p)?`<div class="field"><label>两年维持期</label><select id="maintenanceSelect"><option value="anticipated" ${maintenanceState(p)==='anticipated'?'selected':''}>预计纳入（待医生确认）</option><option value="confirmed" ${maintenanceState(p)==='confirmed'?'selected':''}>医生已确认纳入</option><option value="none" ${maintenanceState(p)==='none'?'selected':''}>不纳入维持期</option></select></div><div class="field"><label>首次维持日期（可选）</label><input id="maintenanceStart" type="date" value="${esc(p.maintenanceStart||'')}"><div class="planned">留空则从最后一次诱导计划日期起按2个自然月推算。</div></div>`:''}</div>
    ${p.status==='dropped'?`<div class="dropbox"><div class="formgrid" style="margin:0"><div class="field"><label>脱落日期</label><input id="dropDate" type="date" value="${esc(p.dropDate||'')}"></div><div class="field"><label>脱落原因</label><input id="dropReason" maxlength="100" value="${esc(p.dropReason||'')}" placeholder="不良反应、疗效、转院、失访、经济原因等"></div></div></div>`:''}
    <div class="upload"><strong>📷 照片辅助录入</strong><br>照片仅供当前页面对照，不上传、不保存。本单文件不具备可靠OCR能力；可先让ChatGPT识别，再核对并手工填写日期。<input id="photoInput" type="file" accept="image/*" capture="environment"><div id="photoName"></div></div>
    <div class="result"><div class="metric primary"><span>下一次计划日期</span><strong>${p.status==='dropped'?'已脱落，不再预测':next?.date?format(next.date):anchor?'全部计划节点已记录':'请填写首剂日期'}</strong></div><div class="metric"><span>距今天</span><strong>${delta===null?'—':delta===0?'今天':delta>0?`${delta} 天`:`已过 ${Math.abs(delta)} 天`}</strong></div><div class="metric"><span>疗程节点</span><strong>${next?esc(next.label):'—'}</strong></div></div>
    <div class="sales"><div class="row"><div><strong>月度回院与销量（全部匿名患者）</strong><div class="planned">可按阶段、方案、完成状态和编号筛选。</div></div><input id="monthInput" type="month" value="${month}"></div><div class="salesgrid"><div class="salesbox"><span>实际销量</span><strong>${stats.actualQty} 支</strong><small>${stats.actualVisits} 次完成</small></div><div class="salesbox"><span>预计销量</span><strong>${stats.forecastQty} 支</strong><small>${stats.forecastVisits} 次待完成</small></div><div class="salesbox"><span>合计</span><strong>${stats.actualQty+stats.forecastQty} 支</strong><small>实际＋预计</small></div></div><div class="filters"><input id="dueQuery" value="${esc(state.dueQuery||'')}" placeholder="搜索匿名编号/病型"><select id="duePhase"><option value="all">全部阶段</option><option value="induction" ${state.duePhase==='induction'?'selected':''}>诱导期</option><option value="maintenance" ${state.duePhase==='maintenance'?'selected':''}>维持期</option></select><select id="dueRegimen"><option value="all">全部方案</option>${Object.entries(REGIMENS).map(([k,v])=>`<option value="${k}" ${state.dueRegimen===k?'selected':''}>${esc(v.short)}</option>`).join('')}</select><select id="dueStatus"><option value="pending" ${(state.dueStatus||'pending')==='pending'?'selected':''}>待回院</option><option value="completed" ${state.dueStatus==='completed'?'selected':''}>本月已完成</option><option value="all" ${state.dueStatus==='all'?'selected':''}>全部</option></select></div><div class="planned" style="margin-bottom:8px">${new Set(due.map(d=>d.p.id)).size} 位患者，${due.length} 个回院节点</div><div class="duelist">${due.length?due.map(dueRow).join(''):'<div class="empty">该月没有符合条件的回院计划。</div>'}</div></div>
    <div class="sectionbar"><div><h2>完整治疗时间轴</h2><p class="planned">${p.rolling?'诱导期按实际日期滚动重估；维持期漏用后仍保留后续原计划。':'按标准时间轴推算。'} “支数”可逐次修正。</p></div><button class="btn ghost small" onclick="window.print()">打印</button></div><div class="timeline">${plan.map(n=>doseRow(n,p,next)).join('')}</div>
    <div class="refs"><strong>方案依据与边界</strong><br>CLL：首周期第1/2/8/15天，随后第2–6周期第1天，每周期28天。FL：G-CHOP为6个21天联合周期后加2个21天佳罗华单药周期；G-CVP为8个21天周期；G-苯达莫司汀为6个28天周期。符合条件者可进行1,000 mg、每2个月一次、最长2年的维持治疗；本页默认生成12次维持节点。<br>核对日期：2026-10-20。来源：<a href="https://www.accessdata.fda.gov/drugsatfda_docs/label/2026/125486s043lbl.pdf" target="_blank" rel="noopener">FDA GAZYVA处方信息（2026）</a>；<a href="https://www.ema.europa.eu/en/documents/product-information/gazyvaro-epar-product-information_en.pdf" target="_blank" rel="noopener">EMA Gazyvaro产品信息</a>。使用前仍须核对中国现行说明书、医院方案和医生医嘱。</div>`;
    bindWorkspace(p)
  }
  function bindWorkspace(p){
    $('#editBtn').onclick=()=>openDialog(p);$('#deleteBtn').onclick=async()=>{if(confirm(`删除匿名患者“${p.code}”及其全部本地记录？`)){try{await deleteRemotePatient(p)}catch(error){alert('Supabase删除失败：'+friendlyError(error));return}state.patients=state.patients.filter(x=>x.id!==p.id);selected=state.patients[0]?.id||null;persist();render();toast('已删除')}};
    $('#regimenSelect').onchange=e=>{if(Object.keys(p.actual||{}).length&&!confirm('切换方案会清空该患者已录入的日期与支数，是否继续？')){e.target.value=p.regimen;return}p.regimen=e.target.value;p.actual={};p.qty={};p.maintenanceStart='';persist();render();syncRemotePatient(p)};
    $('#anchorInput').onchange=e=>{p.anchor=e.target.value;persist();render();syncRemotePatient(p)};$('#todayBtn').onclick=()=>{p.anchor=iso(new Date());persist();render();syncRemotePatient(p)};$('#rollingSelect').onchange=e=>{p.rolling=e.target.value==='1';persist();render()};
    $('#maintenanceSelect')&&($('#maintenanceSelect').onchange=e=>{if(e.target.value==='none'&&Object.keys(p.actual||{}).some(k=>/^m\d+$/.test(k))&&!confirm('已有维持期实际记录，关闭后将暂时隐藏，是否继续？')){e.target.value=maintenanceState(p);return}p.maintenanceStatus=e.target.value;persist();render();syncRemotePatient(p)});
    $('#maintenanceStart')&&($('#maintenanceStart').onchange=e=>{const value=e.target.value,final=planFor(p).filter(n=>n.phase==='induction').at(-1)?.date||'';if(value&&final&&value<=final){alert('首次维持日期应晚于最后一次诱导计划日期。');e.target.value=p.maintenanceStart||'';return}p.maintenanceStart=value;persist();render();syncRemotePatient(p)});
    $('#statusSelect').onchange=e=>{p.status=e.target.value;if(p.status==='dropped'&&!p.dropDate)p.dropDate=iso(new Date());persist();render();syncRemotePatient(p)};$('#dropDate')&&($('#dropDate').onchange=e=>{p.dropDate=e.target.value;persist();render()});$('#dropReason')&&($('#dropReason').onchange=e=>{p.dropReason=e.target.value.trim();persist();render()});
    $('#monthInput').onchange=e=>{state.reportMonth=e.target.value;persist();render()};$('#dueQuery').onchange=e=>{state.dueQuery=e.target.value.trim();persist();render()};$('#duePhase').onchange=e=>{state.duePhase=e.target.value;persist();render()};$('#dueRegimen').onchange=e=>{state.dueRegimen=e.target.value;persist();render()};$('#dueStatus').onchange=e=>{state.dueStatus=e.target.value;persist();render()};
    document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{selected=b.dataset.show;render();window.scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-node]').forEach(i=>i.onchange=e=>{p.actual=p.actual||{};if(e.target.value)p.actual[e.target.dataset.node]=e.target.value;else delete p.actual[e.target.dataset.node];const anchorChanged=e.target.dataset.node==='c1d1';if(anchorChanged)p.anchor=e.target.value;persist();render();if(anchorChanged)syncRemotePatient(p)});document.querySelectorAll('[data-qty]').forEach(i=>i.onchange=e=>{p.qty=p.qty||{};p.qty[e.target.dataset.qty]=Math.max(0,Number(e.target.value)||0);persist();render()});$('#photoInput').onchange=e=>{$('#photoName').textContent=e.target.files[0]?`已选择：${e.target.files[0].name}（仅当前对照）`:''}
  }
  function openDialog(p=null){editId=p?.id||null;$('#dialogTitle').textContent=p?'编辑匿名患者':'新增匿名患者';$('#codeInput').value=p?.code||'';$('#diseaseInput').value=p?.disease||'';$('#regimenInput').innerHTML=options(p?.regimen||'cll');$('#patientDialog').showModal()}
  $('#addBtn').onclick=()=>openDialog();$('#patientForm').onsubmit=async e=>{if(e.submitter?.value==='cancel')return;e.preventDefault();const code=$('#codeInput').value.trim(),disease=$('#diseaseInput').value.trim(),regimen=$('#regimenInput').value;if(!code)return;const existing=editId?state.patients.find(x=>x.id===editId):null;if(editId&&!existing){alert('Supabase保存失败：该患者记录已被其他使用者删除，请关闭后重新新建。');return}const candidate=existing?{...existing}:{id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(36),code:'',disease:'',regimen,anchor:'',actual:{},qty:{},status:'active',rolling:true,maintenanceStatus:'anticipated'};candidate.code=code;candidate.disease=disease;if(candidate.regimen!==regimen){candidate.regimen=regimen;candidate.actual={};candidate.qty={};candidate.anchor='';candidate.maintenanceStart=''}const saveButton=e.submitter;saveButton&&(saveButton.disabled=true);let saved;try{saved=await saveRemotePatient(candidate,{checkVersion:!!existing})}catch(error){alert('Supabase保存失败：'+friendlyError(error));saveButton&&(saveButton.disabled=false);return}saveButton&&(saveButton.disabled=false);if(existing){const index=state.patients.findIndex(x=>x.id===existing.id);if(index>=0)state.patients[index]=saved}else state.patients=[saved,...state.patients.filter(x=>String(x.id)!==String(saved.id))];selected=saved.id;persist();$('#patientDialog').close();render();toast('已保存')};
  $('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`佳罗华匿名随访备份_${iso(new Date())}.json`;a.click();URL.revokeObjectURL(a.href)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!x||!Array.isArray(x.patients)||x.patients.some(p=>!p.id||!p.code||!REGIMENS[p.regimen]))throw Error();if(!confirm(`导入 ${x.patients.length} 条记录将覆盖当前本地数据，是否继续？`))return;state={...x,version:3};selected=state.patients[0]?.id||null;persist();render();toast('导入成功')}catch(err){alert('无法导入：文件格式不正确或包含未知方案。')}finally{e.target.value=''}};
  render();
  initSupabase();
  window.addEventListener('beforeunload',()=>{if(db&&realtimeChannel)db.removeChannel(realtimeChannel)});
})();
</script>
